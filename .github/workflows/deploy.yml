name: Deploy DevOps Observatory

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: ${{ secrets.DOCKER_USERNAME }}/devops-observatory:latest

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F48DCAF474B74C9A89E750CB5A1FC497 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6ED6FB84A12B4FB199B24F7940542538 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F48573F19863409BB322A19B71996695 }}

      - name: Deploy to Azure Web App
        run: |
          az webapp config container set \
            --resource-group devops-observatory \
            --name obs-api-amen \
            --docker-custom-image-name ${{ secrets.DOCKER_USERNAME }}/devops-observatory:latest \
            --docker-registry-server-url https://index.docker.io \
            --docker-registry-server-user ${{ secrets.DOCKER_USERNAME }} \
            --docker-registry-server-password ${{ secrets.DOCKER_TOKEN }}
          az webapp restart --resource-group devops-observatory --name obs-api-amen
