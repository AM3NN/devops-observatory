name: Deploy DevOps Observatory

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Frontend
        run: pnpm --filter @devops-observatory/web build
        env:
          VITE_API_BASE_URL: "" # API is now on same domain, no base URL needed

      - name: Build API (includes frontend)
        run: pnpm --filter @devops-observatory/api-server build

      - name: Prepare deployment package
        run: |
          pnpm --filter @devops-observatory/api-server deploy --prod /tmp/api-deploy
          cd /tmp/api-deploy
          zip -r $GITHUB_WORKSPACE/api-deploy.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_33681BE9DEF54EFB864B065823ED439F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_61B684027DCD456E928ECB9895BCF3DD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1FF38BEA953E4151A648456BC25E8470 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "obs-api-pfe"
          package: "api-deploy.zip"
