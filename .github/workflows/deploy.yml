name: Deploy DevOps Observatory

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: ${{ secrets.DOCKER_USERNAME }}/devops-observatory:latest

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_33681BE9DEF54EFB864B065823ED439F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_61B684027DCD456E928ECB9895BCF3DD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1FF38BEA953E4151A648456BC25E8470 }}

      - name: Deploy to Azure Web App
        run: |
          az webapp config container set \
            --resource-group devops-observatory \
            --name obs-api-pfe \
            --docker-custom-image-name ${{ secrets.DOCKER_USERNAME }}/devops-observatory:latest \
            --docker-registry-server-url https://index.docker.io \
            --docker-registry-server-user ${{ secrets.DOCKER_USERNAME }} \
            --docker-registry-server-password ${{ secrets.DOCKER_TOKEN }}
          az webapp restart --resource-group devops-observatory --name obs-api-pfe
