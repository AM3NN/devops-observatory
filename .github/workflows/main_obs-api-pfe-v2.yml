# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - obs-api-pfe-v2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: am3nn/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_BF5FFAB9DBE24383BD82F586A25736EE }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_0C2CB4F6AFC84FDB8EDADF46AF758667 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: am3nn/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_BF5FFAB9DBE24383BD82F586A25736EE }}/devops-observatory:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8FAB09B9273241AC8CC6ADEC0D91A47D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AC496B3218D34AAE97D4A1563D6CD905 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2EED76946EB9425087B8BF99CBB8238F }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'obs-api-pfe-v2'
          slot-name: 'Production'
          images: 'am3nn/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_BF5FFAB9DBE24383BD82F586A25736EE }}/devops-observatory:${{ github.sha }}'
          