name: Deploy DevOps Observatory

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy-api:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build API
        run: pnpm --filter @devops-observatory/api-server build

      - name: Zip API for deployment
        run: |
          cd artifacts/api-server
          zip -r ../../api-deploy.zip dist package.json
          cd ../..

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_33681BE9DEF54EFB864B065823ED439F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_61B684027DCD456E928ECB9895BCF3DD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1FF38BEA953E4151A648456BC25E8470 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "obs-api-pfe"
          package: "api-deploy.zip"

  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-and-deploy-api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build Frontend
        run: pnpm --filter @devops-observatory/web build
        env:
          VITE_API_BASE_URL: "https://obs-api-pfe.azurewebsites.net"

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "artifacts/devops-observatory"
          api_location: ""
          output_location: "dist/public"
