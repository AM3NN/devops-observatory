kind = "web"
previewPath = "/"
title = "Observatoire DevOps"
version = "1.0.0"
id = "artifacts/devops-observatory"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18788

[services.development]
run = "pnpm --filter @workspace/devops-observatory run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/devops-observatory", "run", "build" ]
publicDir = "artifacts/devops-observatory/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18788"
BASE_PATH = "/"
