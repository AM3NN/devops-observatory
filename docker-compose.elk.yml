services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: observatory-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: observatory-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: observatory-logstash
    ports:
      - "5000:5000/tcp"
    volumes:
      - ./ops/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch

  elastalert2:
    image: jertel/elastalert2:latest
    container_name: observatory-elastalert2
    volumes:
      - ./ops/elastalert2/elastalert.yaml:/opt/elastalert/config.yaml:ro
      - ./ops/elastalert2/rules:/opt/elastalert/rules:ro
    depends_on:
      - elasticsearch

  apm-server:
    image: docker.elastic.co/apm/apm-server:8.15.0
    container_name: observatory-apm-server
    ports:
      - "8200:8200"
    environment:
      - output.elasticsearch.hosts=http://elasticsearch:9200
      - apm-server.host=0.0.0.0:8200
    depends_on:
      - elasticsearch

volumes:
  es-data:
