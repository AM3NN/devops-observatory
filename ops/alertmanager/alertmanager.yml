global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'webhook-observatory'

receivers:
  - name: 'webhook-observatory'
    webhook_configs:
      - url: 'http://host.docker.internal:4000/api/alerts/webhook'
        send_resolved: true
