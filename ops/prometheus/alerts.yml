groups:
  - name: observatory-alerts
    rules:
      - alert: HighErrorRate
        expr: observatory_apm_error_rate_percent > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value }}% on {{ $labels.service }}"

      - alert: HighLatency
        expr: observatory_apm_response_time_ms > 500
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High latency on {{ $labels.service }}"
          description: "Response time is {{ $value }}ms on {{ $labels.service }}"

      - alert: ServiceDegraded
        expr: observatory_services_total{status="degraded"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} service(s) degraded"
          description: "{{ $value }} services are in degraded state"

      - alert: HighCPU
        expr: observatory_apm_cpu_usage_percent > 85
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.service }}"
          description: "CPU usage is {{ $value }}% on {{ $labels.service }}"
